<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle PWM LED & Servo</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #eef2f7 0%, #f9fbfd 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            width: min(100%, 420px);
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
            padding: 24px;
            box-sizing: border-box;
        }
        h1 {
            margin: 0 0 18px;
            font-size: 1.45rem;
            letter-spacing: -0.02em;
            color: #1f2937;
            text-align: center;
        }
        .status-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 22px;
            padding: 14px 16px;
            border-radius: 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .status-label {
            font-size: 0.95rem;
            color: #475569;
            font-weight: 600;
        }
        .status-value {
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .status-connected {
            background: #dcfce7;
            color: #166534;
        }
        .status-disconnected {
            background: #fee2e2;
            color: #991b1b;
        }
        .section {
            margin-bottom: 22px;
        }
        .section-title {
            margin: 0 0 10px;
            font-size: 0.96rem;
            font-weight: 700;
            color: #0f172a;
        }
        .slider-container {
            display: grid;
            gap: 10px;
        }
        .slider {
            width: 100%;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .value-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: #334155;
        }
        .value-row span:last-child {
            font-weight: 700;
        }
        .info {
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #475569;
            text-align: center;
        }
        .button-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .refresh-button {
            border: none;
            border-radius: 999px;
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .refresh-button:hover {
            transform: translateY(-1px);
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Controle PWM LED & Servo</h1>
        <div class="status-row">
            <div class="status-label">Status da conexão</div>
            <div id="connectionState" class="status-value status-disconnected">Desconectado</div>
        </div>

        <section class="section">
            <div class="section-title">LED PWM</div>
            <div class="slider-container">
                <input id="ledSlider" class="slider" type="range" min="0" max="100" value="0" aria-label="Brilho do LED" />
                <div class="value-row"><span>Brilho</span><span id="ledValue">0</span>%</div>
            </div>
        </section>

        <section class="section">
            <div class="section-title">Servo Motor</div>
            <div class="slider-container">
                <input id="servoSlider" class="slider" type="range" min="0" max="180" value="90" aria-label="Ângulo do servo" />
                <div class="value-row"><span>Ângulo</span><span id="servoValue">90</span>°</div>
            </div>
        </section>

        <div class="button-row">
            <button class="refresh-button" onclick="checkStatus()">Verificar conexão</button>
        </div>

    </main>

    <script>
        const ESP32_IP = "http://192.168.4.1";
        const ledSlider = document.getElementById('ledSlider');
        const servoSlider = document.getElementById('servoSlider');
        const ledValue = document.getElementById('ledValue');
        const servoValue = document.getElementById('servoValue');
        const connectionState = document.getElementById('connectionState');

        let ledTimer = null;
        let servoTimer = null;

        function updateConnectionState(connected) {
            connectionState.textContent = connected ? 'Conectado' : 'Desconectado';
            connectionState.classList.toggle('status-connected', connected);
            connectionState.classList.toggle('status-disconnected', !connected);
        }

        async function checkStatus() {
            try {
                const response = await fetch(`${ESP32_IP}/status`, { cache: 'no-store' });
                if (response.ok) {
                    updateConnectionState(true);
                    return true;
                }
            } catch (error) {
                // ignore
            }
            updateConnectionState(false);
            return false;
        }

        async function sendLed(brightness) {
            try {
                const response = await fetch(`${ESP32_IP}/led?brightness=${brightness}`);
                if (!response.ok) throw new Error('Falha no endpoint /led');
                await response.json();
                updateConnectionState(true);
            } catch (error) {
                updateConnectionState(false);
                console.error(error);
            }
        }

        async function sendServo(angle) {
            try {
                const response = await fetch(`${ESP32_IP}/servo?angle=${angle}`);
                if (!response.ok) throw new Error('Falha no endpoint /servo');
                await response.json();
                updateConnectionState(true);
            } catch (error) {
                updateConnectionState(false);
                console.error(error);
            }
        }

        function onLedInput(event) {
            const brightness = event.target.value;
            ledValue.textContent = brightness;
            if (ledTimer) clearTimeout(ledTimer);
            ledTimer = setTimeout(() => sendLed(brightness), 120);
        }

        function onServoInput(event) {
            const angle = event.target.value;
            servoValue.textContent = angle;
            if (servoTimer) clearTimeout(servoTimer);
            servoTimer = setTimeout(() => sendServo(angle), 120);
        }

        window.addEventListener('load', () => {
            ledSlider.addEventListener('input', onLedInput);
            servoSlider.addEventListener('input', onServoInput);
            checkStatus();
            setInterval(checkStatus, 5000);
        });
    </script>
</body>
</html>
